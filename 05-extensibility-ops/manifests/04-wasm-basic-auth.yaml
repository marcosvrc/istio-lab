# Exercício 4 — WasmPlugin: estende o Envoy com um módulo WebAssembly sem
# EnvoyFilter. O istio-agent de cada pod selecionado baixa a imagem OCI,
# guarda em cache e entrega o .wasm ao Envoy.
# Plugin de exemplo do Istio: exige Basic Auth nos paths configurados.
# phase AUTHN = roda antes dos filtros de autorização do Istio.
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: basic-auth
  namespace: sandbox
spec:
  selector:
    matchLabels:
      app: httpbin
  url: oci://ghcr.io/istio-ecosystem/wasm-extensions/basic_auth:1.12.0
  imagePullPolicy: IfNotPresent
  phase: AUTHN
  pluginConfig:
    basic_auth_rules:
      - prefix: /anything/admin
        request_methods: ["GET", "POST"]
        credentials:
          - "admin:istio-lab"

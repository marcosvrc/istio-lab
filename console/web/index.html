<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>istio-lab console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <button id="nav-toggle" class="btn plain inverse" aria-label="Mostrar ou ocultar o menu" aria-controls="nav" aria-expanded="true" data-icon="menu"></button>
    <a class="brand" href="#/">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 1.5 3.5 18H11z" fill="#73bcf7"/>
        <path d="M12.5 6 19.5 18h-7z" fill="#2b9af3"/>
        <path d="M2.5 19.5h19l-2.2 3H4.7z" fill="#73bcf7"/>
      </svg>
      <span><strong>istio-lab</strong> <span class="brand-sub">console</span></span>
    </a>
    <div class="masthead-right">
      <div id="cluster" class="cluster" aria-live="polite"></div>
      <button id="theme-toggle" class="btn plain inverse" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro" data-icon="moon"></button>
      <button id="log-toggle" class="btn plain inverse log-toggle" aria-expanded="false" aria-controls="log" title="Comandos executados">
        <span data-icon="terminal"></span><span class="log-toggle-text">Comandos</span><span id="log-count" class="count">0</span>
      </button>
    </div>
  </header>

  <div class="page">
    <nav id="nav" class="nav" aria-label="Módulos e exercícios"></nav>
    <main id="main" class="main"></main>
  </div>

  <aside id="log" class="drawer" hidden aria-label="Comandos executados">
    <div class="drawer-head">
      <div class="grow">
        <strong>Comandos executados</strong>
        <div class="muted small">tudo o que o console rodou, do mais recente ao mais antigo</div>
      </div>
      <button id="log-close" class="btn plain" aria-label="Fechar" data-icon="close"></button>
    </div>
    <div id="log-filter" class="toggle-group" role="group" aria-label="Filtro"></div>
    <ol id="log-list" class="log-list"></ol>
  </aside>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

# Exercício 11b — registra httpbin.org na mesh, liberando a saída para ele
# mesmo com REGISTRY_ONLY. Fica no namespace sandbox, então o "./*" do
# Sidecar já o inclui.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: httpbin-org
  namespace: sandbox
spec:
  hosts:
    - httpbin.org
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 80
      name: http
      protocol: HTTP
    - number: 443
      name: tls
      protocol: TLS

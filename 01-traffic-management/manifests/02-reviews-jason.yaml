# Exercício 2 — usuário "jason" vê a v2 (estrelas pretas); os demais, a v1.
# O productpage propaga o header "end-user" depois do login.
# As regras são avaliadas em ordem: a primeira que casar vence.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
  namespace: bookinfo
spec:
  hosts:
    - reviews
  http:
    - match:
        - headers:
            end-user:
              exact: jason
      route:
        - destination:
            host: reviews
            subset: v2
    - route:
        - destination:
            host: reviews
            subset: v1

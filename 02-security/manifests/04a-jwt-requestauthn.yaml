# Exercício 4a — o ingress gateway valida JWTs do emissor de teste do Istio.
# RequestAuthentication sozinho só REJEITA tokens inválidos (401);
# requisições SEM token continuam passando. Quem exige token é a
# AuthorizationPolicy (04b).
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: ingress-jwt
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  jwtRules:
    - issuer: testing@secure.istio.io
      jwksUri: https://raw.githubusercontent.com/istio/istio/release-1.31/security/tools/jwt/samples/jwks.json
      # Copia a claim "sub" para um header que o backend recebe
      outputClaimToHeaders:
        - header: x-jwt-sub
          claim: sub

# Exercício 5 — HTTPS no ingress com certificado emitido pelo cert-manager.
#
#   ClusterIssuer selfsigned → Certificate lab-ca (CA raiz do lab)
#   ClusterIssuer lab-ca     → Certificate httpbin.local (secret em istio-system)
#
# O Gateway lê o secret via credentialName; o secret precisa estar no
# namespace do Deployment do gateway (istio-system), não no do Gateway.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: istio-lab-ca
  secretName: lab-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: httpbin-local
  namespace: istio-system
spec:
  secretName: httpbin-local-tls
  dnsNames:
    - httpbin.local
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: lab-ca
    kind: ClusterIssuer
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: httpbin-gateway
  namespace: sandbox
spec:
  selector:
    istio: ingressgateway
  servers:
    # HTTP agora só redireciona para HTTPS
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - httpbin.local
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - httpbin.local
      tls:
        mode: SIMPLE
        credentialName: httpbin-local-tls

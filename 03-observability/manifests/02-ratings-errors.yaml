# Exercício 2 — 30% das chamadas ao ratings falham com 500 e 50% atrasam
# 500ms, para ter taxa de erro e latência interessantes nas métricas.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ratings
  namespace: bookinfo
spec:
  hosts:
    - ratings
  http:
    - fault:
        abort:
          percentage:
            value: 30
          httpStatus: 500
        delay:
          percentage:
            value: 50
          fixedDelay: 500ms
      route:
        - destination:
            host: ratings
            subset: v1
